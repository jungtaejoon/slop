<style>

  #pad b small{font-size:12px}
</style></head><body>

<div id="pad">

  <b data-k="skill" style="right:150px;bottom:16px"><small id="bS"></small></b>
  <b data-k="dash" style="right:82px;bottom:76px"><small id="bD"></small></b>
  <b data-k="atk" style="right:82px;bottom:10px"><small id="bA"></small></b>
