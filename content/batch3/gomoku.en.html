<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gomoku</title>
<style>
  html,body{margin:0;height:100%;background:#2b2118;color:#fbf3e4;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;box-sizing:border-box}
  h1{margin:0;font-size:22px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .msg{font-weight:800;min-height:22px}
  .tally{font-variant-numeric:tabular-nums;color:#e7d5b5;font-size:14px}
  canvas{touch-action:manipulation;border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0/.45);cursor:pointer}
  button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:9px 16px;background:#e7c98f;color:#2b2118;cursor:pointer}
  button.on{background:#fbbf24}
  button.ghost{background:#4a3a2a;color:#fbf3e4}
</style></head><body><main>
<h1 id="h"></h1>
<div class="bar"><button id="easy"></button><button id="hard"></button><span class="tally" id="tally"></span></div>
<canvas id="c"></canvas>
<div class="msg" id="msg"></div>
<div class="bar"><button class="ghost" id="undo"></button><button id="again"></button></div>
</main><script>
// Gomoku against a small heuristic AI: you are black and move first.
// The AI scores every empty point near the stones by the lines it would make
// for itself and the lines it would block for you, then plays the best one.
const LANG = 'en';
const T = { ko: { title: '오목 한 판', easy: '쉬움', hard: '어려움', you: '내 차례 (흑)', ai: 'AI가 생각 중…', win: '이겼어요! 🎉', lose: 'AI가 이겼어요', draw: '무승부', undo: '한 수 무르기', again: '새 판', tally: (w, l) => `나 ${w} : ${l} AI` }, en: { title: 'Gomoku', easy: 'Easy', hard: 'Hard', you: 'Your move (black)', ai: 'AI is thinking…', win: 'You win! 🎉', lose: 'The AI wins', draw: 'Draw', undo: 'Undo', again: 'New game', tally: (w, l) => `You ${w} : ${l} AI` } }[LANG];
document.documentElement.lang = LANG; document.title = T.title;
const $ = (id) => document.getElementById(id);
$('h').textContent = T.title; $('easy').textContent = T.easy; $('hard').textContent = T.hard; $('undo').textContent = T.undo; $('again').textContent = T.again;
const N = 15, cv = $('c'), g = cv.getContext('2d');
let B, hist, over, mode = 'hard', wins = 0, losses = 0, cell, winLine = null;
const DIR = [[1, 0], [0, 1], [1, 1], [1, -1]];
const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

function reset() { B = Array.from({ length: N }, () => Array(N).fill(0)); hist = []; over = false; winLine = null; msg(T.you); draw(); }
function layout() { const s = Math.min(innerWidth - 20, innerHeight - 200, 540), dpr = Math.min(devicePixelRatio || 1, 2); cell = s / N; cv.style.width = cv.style.height = s + 'px'; cv.width = cv.height = s * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
function msg(t) { $('msg').textContent = t; $('tally').textContent = T.tally(wins, losses); $('easy').className = mode === 'easy' ? 'on' : ''; $('hard').className = mode === 'hard' ? 'on' : ''; }

// five (or more) in a row through (x, y)? returns the line
function five(x, y, p) {
  for (const [dx, dy] of DIR) {
    const line = [[x, y]];
    for (const s of [1, -1]) { let i = 1; while (inb(x + dx * i * s, y + dy * i * s) && B[y + dy * i * s][x + dx * i * s] === p) { line.push([x + dx * i * s, y + dy * i * s]); i++; } }
    if (line.length >= 5) return line;
  }
  return null;
}
// how good is a stone of player p at (x, y)? counts runs and open ends in all four directions
function value(x, y, p) {
  let total = 0;
  for (const [dx, dy] of DIR) {
    let run = 1, open = 0;
    for (const s of [1, -1]) {
      let i = 1; while (inb(x + dx * i * s, y + dy * i * s) && B[y + dy * i * s][x + dx * i * s] === p) { run++; i++; }
      if (inb(x + dx * i * s, y + dy * i * s) && B[y + dy * i * s][x + dx * i * s] === 0) open++;
    }
    total += run >= 5 ? 1e6 : run === 4 ? (open === 2 ? 1e5 : open ? 1e4 : 0) : run === 3 ? (open === 2 ? 5e3 : open ? 400 : 0) : run === 2 ? (open === 2 ? 200 : open ? 30 : 0) : open;
  }
  return total;
}
function aiMove() {
  let best = null, bestS = -1;
  const near = (x, y) => { for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (inb(x + dx, y + dy) && B[y + dy][x + dx]) return true; return false; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (B[y][x] || !near(x, y)) continue;
    const s = value(x, y, 2) * 1.05 + value(x, y, 1) * (mode === 'hard' ? 1 : 0.55) + Math.random() * (mode === 'hard' ? 5 : 900);
    if (s > bestS) { bestS = s; best = [x, y]; }
  }
  return best || [7, 7];
}
function place(x, y, p) {
  B[y][x] = p; hist.push([x, y]); tone(p === 1 ? 420 : 300);
  const line = five(x, y, p);
  if (line) { over = true; winLine = line; if (p === 1) { wins++; msg(T.win); fanfare(); } else { losses++; msg(T.lose); } }
  else if (hist.length === N * N) { over = true; msg(T.draw); }
  draw();
}
cv.addEventListener('click', (e) => {
  if (over || hist.length % 2) return;
  const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / cell), y = Math.floor((e.clientY - r.top) / cell);
  if (!inb(x, y) || B[y][x]) return;
  place(x, y, 1); if (over) return;
  msg(T.ai); setTimeout(() => { const [ax, ay] = aiMove(); place(ax, ay, 2); if (!over) msg(T.you); }, 260);
});
$('undo').onclick = () => { if (hist.length < 2 || (over && winLine && B[winLine[0][1]][winLine[0][0]] === 1)) return; if (over) { losses = Math.max(0, losses - 1); over = false; winLine = null; } for (let i = 0; i < 2; i++) { const [x, y] = hist.pop(); B[y][x] = 0; } msg(T.you); draw(); };
$('again').onclick = reset;
$('easy').onclick = () => { mode = 'easy'; msg($('msg').textContent); };
$('hard').onclick = () => { mode = 'hard'; msg($('msg').textContent); };
function draw() {
  const s = cell * N; const wood = g.createLinearGradient(0, 0, s, s); wood.addColorStop(0, '#e8c27c'); wood.addColorStop(1, '#d9a95b');
  g.fillStyle = wood; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(70,45,20,.7)'; g.lineWidth = 1;
  for (let i = 0; i < N; i++) { const p = cell * i + cell / 2; g.beginPath(); g.moveTo(cell / 2, p); g.lineTo(s - cell / 2, p); g.moveTo(p, cell / 2); g.lineTo(p, s - cell / 2); g.stroke(); }
  for (const [x, y] of [[3, 3], [11, 3], [7, 7], [3, 11], [11, 11]]) { g.fillStyle = 'rgba(70,45,20,.8)'; g.beginPath(); g.arc(x * cell + cell / 2, y * cell + cell / 2, 3, 0, 7); g.fill(); }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const p = B[y][x]; if (!p) continue; const cx = x * cell + cell / 2, cy = y * cell + cell / 2, r = cell * 0.44;
    const st = g.createRadialGradient(cx - r / 3, cy - r / 3, r / 6, cx, cy, r);
    if (p === 1) { st.addColorStop(0, '#666'); st.addColorStop(1, '#111'); } else { st.addColorStop(0, '#fff'); st.addColorStop(1, '#cfcac0'); }
    g.fillStyle = st; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  }
  const last = hist[hist.length - 1];
  if (last) { g.fillStyle = '#ef4444'; g.beginPath(); g.arc(last[0] * cell + cell / 2, last[1] * cell + cell / 2, cell * 0.1, 0, 7); g.fill(); }
  if (winLine) { g.strokeStyle = '#ef4444'; g.lineWidth = 4; g.beginPath(); const xs = winLine.sort((a, b) => a[0] - b[0] || a[1] - b[1]); g.moveTo(xs[0][0] * cell + cell / 2, xs[0][1] * cell + cell / 2); const e = xs[xs.length - 1]; g.lineTo(e[0] * cell + cell / 2, e[1] * cell + cell / 2); g.stroke(); }
}
let ac; function tone(f, t = 0.05) { try { ac ??= new AudioContext(); const o = ac.createOscillator(), v = ac.createGain(); o.type = 'square'; o.frequency.value = f; v.gain.setValueAtTime(0.03, ac.currentTime); v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t); o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime + t); } catch { /* */ } }
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2), i * 110)); }
addEventListener('resize', () => { layout(); draw(); });
layout(); reset();
</script></body></html>
