<title>Slop Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with board strip; 3-column community layout (boards · threads · sidebar) collapsing to one column. */
:root{
  --bg:#EDEEEA; --surface:#FFFFFF; --sunk:#E3E5DF; --ink:#1A1C19; --muted:#5D645B; --line:#D3D7CD;
  --gem:#0B7F73; --gem-soft:#D5EFEA; --slop:#B4581F; --slop-soft:#F6E2D4; --warn:#B3261E; --warn-soft:#F9DEDC; --ok:#1E7F4A; --ok-soft:#DBF0E2;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121412; --surface:#1B1E1B; --sunk:#242823; --ink:#ECEEE7; --muted:#9AA297; --line:#2F342E;
  --gem:#3FD0BE; --gem-soft:#123430; --slop:#F09A5E; --slop-soft:#3A2617; --warn:#F2867E; --warn-soft:#3B1C1A; --ok:#5CCB8A; --ok-soft:#183324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121412; --surface:#1B1E1B; --sunk:#242823; --ink:#ECEEE7; --muted:#9AA297; --line:#2F342E;
  --gem:#3FD0BE; --gem-soft:#123430; --slop:#F09A5E; --slop-soft:#3A2617; --warn:#F2867E; --warn-soft:#3B1C1A; --ok:#5CCB8A; --ok-soft:#183324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gem);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;flex-direction:column;text-decoration:none;line-height:1}
.logo b{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.5px}
.logo b i{font-style:normal;color:var(--gem)}
.logo span{font-size:11px;color:var(--muted);margin-top:3px}
.gsearch{flex:1;min-width:0;max-width:520px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px}
.top .sp{flex:1}
.me{width:30px;height:30px;border-radius:50%;border:1px solid var(--line)}
.boards{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;scrollbar-width:none}
.boards a{flex:none;font-size:13px;padding:4px 10px;border-radius:999px;text-decoration:none;color:var(--muted);border:1px solid transparent}
.boards a:hover{color:var(--ink);border-color:var(--line)}
.boards a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.btn.gem{background:var(--gem);border-color:var(--gem);color:var(--surface);font-weight:700}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding-block:20px 64px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.2}
h2{font-size:15px;font-weight:700}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.banner{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);background:var(--surface);margin-bottom:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h2{margin-bottom:8px}
.panel p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.panel ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.statrow{display:flex;gap:18px;margin:6px 0 10px}
.statrow div{display:flex;flex-direction:column}
.statrow b{font-family:var(--f-mono);font-size:18px}
.statrow span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:none;cursor:pointer;text-decoration:none}
.chip:hover,.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip .mono{font-size:11px;margin-left:3px}

/* feed */
.fhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.fhead p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
.sortbar .sp{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:13px;border-radius:999px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--gem-soft);color:var(--gem);border-radius:999px;padding:3px 6px 3px 10px;border:0;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.list.compact{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 6px}
.post:hover{border-color:var(--muted)}
.compact .post{border:0;border-radius:0;border-top:1px solid var(--line);grid-template-columns:44px minmax(0,1fr) 72px}
.compact .post:first-child{border-top:0}
.vote{display:flex;flex-direction:column;align-items:center;gap:0}
.vote button{border:0;background:none;cursor:pointer;width:30px;height:24px;border-radius:6px;color:var(--muted);font-size:13px;line-height:1}
.vote button.up:hover,.vote button.up[aria-pressed="true"]{color:var(--gem);background:var(--gem-soft)}
.vote button.dn:hover,.vote button.dn[aria-pressed="true"]{color:var(--slop);background:var(--slop-soft)}
.vote .sc{font-size:13px;font-weight:600;min-height:20px}
.vote.h{flex-direction:row;gap:2px;background:var(--bg);border-radius:999px;padding:1px}
.vote.h .sc{min-width:26px;text-align:center;min-height:0}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.pmeta a{text-decoration:none}
.pmeta a:hover{text-decoration:underline}
.pmeta .cat{color:var(--ink);font-weight:700}
.pill{font-family:var(--f-mono);font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gem{border-color:var(--gem);background:var(--gem-soft);color:var(--gem)}
.pill.new{border-color:var(--slop);color:var(--slop)}
.pill.tool{border-style:dashed}
.ptitle{display:block;font-size:17px;font-weight:700;line-height:1.35;text-decoration:none;margin:3px 0 6px;overflow-wrap:anywhere}
.ptitle:hover{text-decoration:underline}
.compact .ptitle{font-size:15px;margin-bottom:3px}
.excerpt{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;overflow-wrap:anywhere}
.prev{border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px;background:var(--sunk);position:relative;max-width:640px}
.prev img{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--sunk)}
.prev.frame{aspect-ratio:16/9}
.prev.frame iframe{position:absolute;left:0;top:0;width:400%;height:400%;transform:scale(.25);transform-origin:0 0;border:0;pointer-events:none;background:#fff}
.prev .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.prev.linkp{display:flex;gap:10px;align-items:center;padding:10px 12px;text-decoration:none;font-size:13px}
.prev.linkp .d{font-family:var(--f-mono);font-size:12px;color:var(--gem)}
.prev.codep pre{margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:12px;max-height:120px;overflow:hidden;white-space:pre}
.thumb{width:72px;height:56px;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.pact{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.pact .btn{padding:3px 9px;font-size:12.5px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.empty h2{font-size:18px;margin-bottom:8px}
.empty ol{margin:8px 0 16px;padding-left:20px;color:var(--muted)}

/* post detail */
.crumb{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--ink)}
.article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.article h1{margin:4px 0 10px;overflow-wrap:anywhere}
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
.md{overflow-wrap:anywhere;max-width:72ch}
.md p{margin:0 0 10px}
.md h4{font-size:16px;margin:14px 0 6px}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md a{color:var(--gem)}
pre.code{margin:0;max-height:560px;overflow:auto;padding:12px 14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--sunk);border-radius:8px;tab-size:2}
.linkcard{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;background:var(--bg);overflow-wrap:anywhere}
.linkcard:hover{border-color:var(--gem)}
.linkcard .d{font-family:var(--f-mono);font-size:12px;color:var(--gem)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gallery.one{grid-template-columns:minmax(0,1fr)}
.gallery img{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:block;max-height:640px;object-fit:contain}
details.prompt{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
details.prompt summary{cursor:pointer;font-size:13px;font-weight:700}
details.prompt pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12.5px;margin:8px 0 0}
.stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.stage-bar .sp{flex:1}
.runner{height:min(66vh,580px);background:#fff}
.runner iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.stage:fullscreen .runner{height:calc(100% - 46px)}
.diff{max-height:560px;overflow:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--sunk);border-radius:8px}
.diff div{white-space:pre;padding:0 12px}
.diff .a{background:var(--ok-soft);color:var(--ok)}
.diff .d{background:var(--warn-soft);color:var(--warn)}
.diff .gap{color:var(--muted);background:var(--bg);padding:2px 12px;font-style:italic}
.verdict{display:flex;flex-direction:column;gap:6px}
.vbar{height:8px;border-radius:999px;background:var(--slop-soft);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--gem)}
.vnums{display:flex;justify-content:space-between;font-size:12.5px}
.vnums .g{color:var(--gem)} .vnums .s{color:var(--slop)}
.verbtns{display:flex;gap:8px}
.verbtns button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;font-weight:700;font-size:14px}
.verbtns .g[aria-pressed="true"],.verbtns .g:hover{border-color:var(--gem);color:var(--gem);background:var(--gem-soft)}
.verbtns .s[aria-pressed="true"],.verbtns .s:hover{border-color:var(--slop);color:var(--slop);background:var(--slop-soft)}
.oldver{background:var(--slop-soft);color:var(--slop);border-radius:8px;padding:8px 12px;font-size:13px}
.hist a{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;font-size:13px}
.hist a:first-child{border-top:0}
.hist a[aria-current="true"] b{color:var(--gem)}
.hist .m{font-size:11.5px;color:var(--muted)}
.ai-sum{border:1px solid var(--gem);background:var(--gem-soft);border-radius:var(--r);padding:12px 14px}
.ai-sum .md{max-width:none;font-size:14px}

/* comments */
.thread{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.thread-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.thread-head .sp{flex:1}
.cbox{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
textarea,input[type=text],input[type=url],select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.flairs{display:flex;flex-wrap:wrap;gap:4px}
.flairs button{font-size:12px;border:1px solid var(--line);background:none;border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.flairs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.cmt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;margin-top:10px}
.cmt > .rail{display:flex;justify-content:center;cursor:pointer;padding-top:26px}
.cmt > .rail i{width:2px;background:var(--line);border-radius:2px}
.cmt > .rail:hover i{background:var(--muted)}
.cmt .av{width:22px;height:22px;border-radius:50%;background:var(--sunk)}
.ch{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted);min-height:22px}
.ch .nm{color:var(--ink);font-weight:600}
.ctext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;margin:3px 0 4px}
.cmt.gemc > div > .ctext{border-left:3px solid var(--gem);padding-left:10px}
.cact{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.linkbtn{border:0;background:none;padding:3px 7px;color:var(--muted);cursor:pointer;font-size:12px;border-radius:6px}
.linkbtn:hover{background:var(--sunk);color:var(--ink)}
.flair{font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line)}
.flair.gem{border-color:var(--gem);color:var(--gem);background:var(--gem-soft)}
.flair.improve{border-color:var(--slop);color:var(--slop)}
.flair.question{border-style:dashed}
.collapsed{font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px}
.who{display:inline-flex;align-items:center;gap:5px}
.who .av{width:16px;height:16px;border-radius:50%;background:var(--sunk)}
.authbtn{border:0;background:none;padding:0;cursor:pointer;font-size:inherit;color:inherit}
.authbtn:hover{text-decoration:underline}

/* compose */
.compose{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.compose{grid-template-columns:minmax(0,1fr)}}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.field > .flabel{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13.5px;display:flex;flex-direction:column;align-items:flex-start;min-width:92px}
.kinds button small{font-size:11px;color:var(--muted)}
.kinds button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
textarea.codeed{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;min-height:300px;tab-size:2;white-space:pre;overflow:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--gem);color:var(--gem)}
.upl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.upl div{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.upl img{width:100%;height:100%;object-fit:cover}
.upl button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);width:22px;height:22px;cursor:pointer;font-size:12px}
.mdprev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);min-height:80px}
/* moderation */
.pill.pin{border-color:var(--ink);color:var(--ink)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.banner.warnb{border-style:solid;border-color:var(--warn);color:var(--warn);background:var(--warn-soft);margin:14px 0 0}
.modbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.mq{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.mq:first-of-type{border-top:0;padding-top:4px}
.mq-h{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mq .ptitle{font-size:15px;margin:0}
.logrow{border-top:1px solid var(--line);padding:7px 0;font-size:13px;overflow-wrap:anywhere}
.logrow:first-child{border-top:0}
.logrow .m{font-size:11.5px;color:var(--muted)}
.dlg-back{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.reasons{display:flex;flex-direction:column;gap:6px;font-size:14px}
.reasons label{display:flex;gap:8px;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

<script>
/* ---------- taxonomy ---------- */
const CATS = [
  ['web','웹·앱','AI로 만든 웹페이지, 앱, 도구. 실행물로 올리면 바로 돌려볼 수 있어요.','html'],
  ['game','게임','AI가 만든 게임과 장난감. 플레이해 보고 판정해 주세요.','html'],
  ['art','이미지·아트','생성 이미지, 일러스트, 디자인 시안.','image'],
  ['writing','글·이야기','시, 소설, 에세이, 가사 같은 AI 글.','text'],
  ['music','음악·오디오','생성 음악과 사운드. 링크로 공유해요.','link'],
  ['video','영상','생성 영상과 애니메이션. 링크로 공유해요.','link'],
  ['code','코드·자동화','스크립트, 함수, 자동화 레시피.','code'],
  ['prompt','프롬프트·대화','쓸 만한 프롬프트와 인상적인 대화 기록.','text'],
  ['idea','아이디어·기획','AI가 낸 사업·기획·연구 아이디어.','text'],
  ['etc','기타','어디에도 안 맞는 것들.','text'],
];
const CAT = Object.fromEntries(CATS.map(([k,l,d,dk])=>[k,{k,l,d,dk}]));
const KINDS = { text:['글','본문 중심'], link:['링크','외부 주소'], image:['이미지','사진 업로드'], html:['실행물','HTML 바로 실행'], code:['코드','복사해서 쓰기'] };
const FLAIRS = { opinion:'의견', gem:'가치 발견', improve:'개선 제안', question:'질문', info:'출처·정보' };
const TOOLS = ['Claude','ChatGPT','Gemini','Midjourney','Stable Diffusion','DALL·E','Flux','Suno','Udio','Sora','Runway','Cursor','Copilot','v0','Lovable'];
const MAX_CODE = 200*1024, MAX_BODY = 40000;
const isGem = v => v.up>=3 && v.up/(v.up+v.down) >= .75;

/* ---------- state ---------- */
const S = { db:null, user:null, sample:null, assets:null, uid:null, me:null, canWrite:null,
  posts:new Map(), postsLoaded:false, slow:false, comments:new Map(), votes:new Map(), myVotes:{p:{},c:{}}, saved:{},
  pv:{}, cv:{}, view:{name:'feed'}, q:'', tool:null, author:null, d:null, c:null,
  isMod:false, mod:{}, cfg:{banned:{},pinned:{}}, myReports:{items:{}}, reports:new Map(), modlog:[], modArm:null,
  prefs:{sort:'hot',win:'week',layout:'card',csort:'best'} };
try{ Object.assign(S.prefs, JSON.parse(localStorage.getItem('slop-prefs')||'{}')); }catch{}
const savePrefs = ()=>{ try{ localStorage.setItem('slop-prefs',JSON.stringify(S.prefs)); }catch{} };
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const safeUrl = u => /^https?:\/\/[^\s]+$/i.test(u||'') ? u : '';
const domain = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };
function ago(ts){ if(!ts) return ''; const s=(Date.now()-ts)/1000;
  if(s<60) return '방금'; if(s<3600) return Math.floor(s/60)+'분 전'; if(s<86400) return Math.floor(s/3600)+'시간 전';
  if(s<86400*30) return Math.floor(s/86400)+'일 전'; const d=new Date(ts); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const banned = () => !!(S.uid && S.cfg.banned?.[S.uid]);
const canW = () => !!(S.db && S.uid && S.canWrite!==false && !banned());
const hiddenP = id => !!S.mod['p-'+id]?.hidden, hiddenC = id => !!S.mod['c-'+id]?.hidden, lockedP = id => !!S.mod['p-'+id]?.locked;
const who = uid => `<span class="who"><img class="av" data-av="${esc(uid)}" alt=""><button class="authbtn" data-author="${esc(uid)}" data-uid="${esc(uid)}">…</button></span>`;
async function fillPeople(root=document){
  const els=[...root.querySelectorAll('[data-uid],[data-av]')]; if(!els.length) return;
  const ids=[...new Set(els.map(e=>e.dataset.uid||e.dataset.av).filter(Boolean))];
  let ps={}; if(S.user){ try{ ps=await S.user.profiles(ids); }catch{} }
  for(const e of els){ const id=e.dataset.uid||e.dataset.av, p=ps[id];
    if(e.dataset.uid!==undefined) e.textContent = p?.isMe ? (p.name||'나') : (p?.name||'익명');
    else if(p?.avatarUrl) e.src=p.avatarUrl; else e.hidden=true; }
}
function sandboxFrame(code,title='실행물'){ const f=document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts allow-pointer-lock'); f.title=title; f.srcdoc=code; return f; }

/* ---------- markdown-lite (author text only, always escaped first) ---------- */
function md(src){
  const blocks=[]; let s=String(src||'').replace(/\r/g,'');
  s=s.replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{ blocks.push(`<pre class="code">${esc(c.replace(/\n$/,''))}</pre>`); return `\n\u0000${blocks.length-1}\u0000\n`; });
  const L='target="_blank" rel="noopener noreferrer"';
  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,`<a href="$2" ${L}>$1</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g,`$1<a href="$2" ${L}>$2</a>`);
  const out=[]; let para=[], list=null;
  const fp=()=>{ if(para.length){ out.push('<p>'+para.map(inl).join('<br>')+'</p>'); para=[]; } };
  const fl=()=>{ if(list){ out.push(`<${list.t}>${list.items.map(i=>'<li>'+inl(i)+'</li>').join('')}</${list.t}>`); list=null; } };
  for(const line of s.split('\n')){ let m; const tr=line.trim();
    if((m=tr.match(/^\u0000(\d+)\u0000$/))){ fp(); fl(); out.push(blocks[+m[1]]); continue; }
    if(!tr){ fp(); fl(); continue; }
    if((m=line.match(/^#{1,3}\s+(.*)/))){ fp(); fl(); out.push(`<h4>${inl(m[1])}</h4>`); continue; }
    if((m=line.match(/^>\s?(.*)/))){ fp(); fl(); out.push(`<blockquote>${inl(m[1])}</blockquote>`); continue; }
    if((m=line.match(/^\s*([-*]|\d+\.)\s+(.*)/))){ const t=/\d/.test(m[1])?'ol':'ul'; fp(); if(list&&list.t!==t) fl(); list??={t,items:[]}; list.items.push(m[2]); continue; }
    fl(); para.push(line); }
  fp(); fl(); return out.join('');
}

/* ---------- votes ---------- */
function computeVotes(){ const pv={}, cv={};
  for(const doc of S.votes.values()){
    for(const [id,d] of Object.entries(doc?.p||{})){ const v=pv[id]??={up:0,down:0}; d>0?v.up++:v.down++; }
    for(const [id,d] of Object.entries(doc?.c||{})){ const v=cv[id]??={up:0,down:0}; d>0?v.up++:v.down++; } }
  S.pv=pv; S.cv=cv; }
const pS = id => { const v=S.pv[id]||{up:0,down:0}; return {...v,score:v.up-v.down,mine:S.myVotes.p?.[id]||0}; };
const cS = id => { const v=S.cv[id]||{up:0,down:0}; return {...v,score:v.up-v.down,mine:S.myVotes.c?.[id]||0}; };
function voteInner(t,id){ const s=t==='p'?pS(id):cS(id);
  return `<button class="up" data-vote="${t}" data-id="${id}" data-d="1" aria-pressed="${s.mine===1}" aria-label="보석: 가치 있음" title="보석: 가치 있음">▲</button><span class="sc mono">${s.score}</span><button class="dn" data-vote="${t}" data-id="${id}" data-d="-1" aria-pressed="${s.mine===-1}" aria-label="슬롭: 가치 없음" title="슬롭: 가치 없음">▼</button>`; }
const voteBox = (t,id,h) => `<div class="vote${h?' h':''}" data-vs="${t}:${id}">${voteInner(t,id)}</div>`;
function verdictInner(id){ const s=pS(id), tot=s.up+s.down, pct=tot?Math.round(s.up/tot*100):0;
  return `<div class="vbar" aria-hidden="true"><i style="width:${tot?pct:0}%"></i></div>
    <div class="vnums"><span class="g">보석 <b class="mono">${s.up}</b></span><span class="muted">${tot?`${pct}% 보석 판정 · ${tot}표`:'아직 판정 없음'}</span><span class="s">슬롭 <b class="mono">${s.down}</b></span></div>
    <div class="verbtns"><button class="g" data-vote="p" data-id="${id}" data-d="1" aria-pressed="${s.mine===1}">▲ 보석이다</button><button class="s" data-vote="p" data-id="${id}" data-d="-1" aria-pressed="${s.mine===-1}">▼ 슬롭이다</button></div>`; }
function refreshVotes(){
  document.querySelectorAll('[data-vs]').forEach(el=>{ const [t,id]=el.dataset.vs.split(':'); el.innerHTML=voteInner(t,id); });
  document.querySelectorAll('[data-verdict]').forEach(el=>el.innerHTML=verdictInner(el.dataset.verdict));
  document.querySelectorAll('[data-gembadge]').forEach(el=>el.hidden=!isGem(pS(el.dataset.gembadge)));
}
let voteChain=Promise.resolve();
function vote(t,id,d){
  if(!canW()){ toast(S.uid?'이 공유 권한으로는 판정할 수 없어요':'판정하려면 claude.ai에 로그인해 주세요'); return; }
  const mine=structuredClone(S.myVotes); mine.p??={}; mine.c??={};
  const m=mine[t]; if(m[id]===d) delete m[id]; else m[id]=d;
  S.myVotes=mine; S.votes.set(S.uid,mine); computeVotes(); refreshVotes(); if(S.view.name==='feed') renderSideOnly();
  voteChain=voteChain.then(()=>S.db.doc('votes/'+S.uid).set(S.myVotes)).catch(e=>toast(e?.code==='invalid_argument'?'이 공유 권한으로는 판정할 수 없어요':'판정을 저장하지 못했어요'));
}
let saveChain=Promise.resolve();
function toggleSave(id){
  if(!S.db||!S.uid){ toast('저장하려면 claude.ai에 로그인해 주세요'); return; }
  const s={...S.saved}; if(s[id]) delete s[id]; else s[id]=Date.now(); S.saved=s;
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>b.textContent=s[id]?'저장됨':'저장');
  toast(s[id]?'저장함에 넣었어요':'저장함에서 뺐어요');
  saveChain=saveChain.then(()=>S.db.doc(`data/users/${S.uid}/saved`).set({ids:S.saved})).catch(()=>toast('저장하지 못했어요'));
}

/* ---------- boot ---------- */
async function boot(){
  renderBoards(); window.addEventListener('hashchange',route); route();
  const use = n => window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db,user,sample,assets] = await Promise.all([use('db'),use('user'),use('sample'),use('assets')]);
  Object.assign(S,{db,user,sample,assets});
  if(user){ S.me=await user.me(); S.uid=S.me.id; S.canWrite=await user.can('data.write'); S.isMod=await user.canEdit();
    if(S.me.avatarUrl){ const m=$('#meAv'); m.src=S.me.avatarUrl; m.alt=S.me.name||'나'; m.hidden=false; } }
  $('#newBtn').hidden = !canW();
  if(S.d){ S.d.unsubs?.forEach(u=>u()); S.d=null; } S.c=null; S.view={name:'boot'};
  if(!db){ S.postsLoaded=true; S.offline=true; route(); return; }
  const slowT=setTimeout(()=>{ S.slow=true; onData(); },10000);
  db.collection('posts').orderBy('createdAt','desc').limit(1000).onSnapshot(snap=>{
    S.posts=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    if(!snap.metadata.fromCache||snap.size){ S.postsLoaded=true; S.slow=false; clearTimeout(slowT); }
    onData(); }, ()=>{ clearTimeout(slowT); S.postsLoaded=true; S.loadErr=true; onData(); });
  db.collection('comments').orderBy('createdAt','desc').limit(1000).onSnapshot(snap=>{
    S.comments=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}])); onData('comments'); }, ()=>{});
  db.collection('votes').onSnapshot(snap=>{
    S.votes=new Map(snap.docs.map(d=>[d.id,d.data()]));
    if(S.uid&&S.votes.has(S.uid)) S.myVotes=structuredClone(S.votes.get(S.uid));
    computeVotes(); refreshVotes(); onData('votes'); }, ()=>{});
  if(S.uid) db.doc(`data/users/${S.uid}/saved`).onSnapshot(s=>{ S.saved={...(s.data()?.ids||{})}; if(S.view.special==='saved') onData(); }, ()=>{});
  db.collection('modactions').onSnapshot(s=>{ S.mod=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); refreshAll(); },()=>{});
  db.doc('modconfig/main').onSnapshot(s=>{ S.cfg={banned:{},pinned:{},...(s.data()||{})}; $('#newBtn').hidden=!canW(); renderBanNote(); refreshAll(); },()=>{});
  if(S.uid) db.doc('reports/'+S.uid).onSnapshot(s=>{ S.myReports={items:{},...(s.data()||{})}; },()=>{});
  if(S.isMod){
    db.collection('reports').onSnapshot(s=>{ S.reports=new Map(s.docs.map(d=>[d.id,d.data()])); renderBoards(); if(S.view.name==='mod') renderMod(); },()=>{});
    db.collection('modlog').orderBy('at','desc').limit(200).onSnapshot(s=>{ S.modlog=s.docs.map(d=>({id:d.id,...d.data()})); if(S.view.name==='mod') renderMod(); },()=>{}); }
  route();
}
function onData(kind){ const v=S.view;
  if(v.name==='feed') renderFeed(kind);
  else if(v.name==='post' && S.d) renderPost(kind);
  else if(v.name==='mod' && kind!=='votes') renderMod();
}
function refreshAll(){ feedSig=null;
  if(S.d){ S.d.contentKey=null; S.d.threadSig=null; const ps=$('#pSide'); if(ps) delete ps.dataset.k; }
  renderBoards(); if(S.view.name==='mod') renderMod(); else onData(); }
function renderBanNote(){ const el=$('#banNote'), b=S.uid&&S.cfg.banned?.[S.uid]; el.hidden=!b;
  if(b) el.firstElementChild.textContent=`운영자가 이 계정의 글쓰기·댓글·판정을 제한했어요${b.reason?` (사유: ${b.reason})`:''}. 읽기는 계속할 수 있어요.`; }

/* ---------- router ---------- */
function parseHash(){ const h=location.hash.slice(1); let m;
  if(!h||h==='all') return {name:'feed',cat:null};
  if(h==='gems'||h==='saved') return {name:'feed',cat:null,special:h};
  if((m=h.match(/^c-([a-z]+)$/))&&CAT[m[1]]) return {name:'feed',cat:m[1]};
  if((m=h.match(/^p-([a-z0-9]+)(?:-v(\d+))?$/))) return {name:'post',id:m[1],n:m[2]?+m[2]:null};
  if(h==='mod') return {name:'mod'};
  if(h==='submit') return {name:'compose',mode:'new'};
  if((m=h.match(/^submit-([a-z]+)$/))) return {name:'compose',mode:'new',cat:CAT[m[1]]?m[1]:null};
  if((m=h.match(/^edit-([a-z0-9]+)$/))) return {name:'compose',mode:'edit',id:m[1]};
  if((m=h.match(/^remix-([a-z0-9]+)-v(\d+)$/))) return {name:'compose',mode:'remix',id:m[1],n:+m[2]};
  return {name:'feed',cat:null};
}
function route(){ const v=parseHash(), prev=S.view;
  const samePost = v.name==='post' && prev.name==='post' && S.d && prev.id===v.id;
  if(!samePost && S.d){ S.d.unsubs?.forEach(u=>u()); S.d=null; }
  const sameCompose = v.name==='compose' && prev.name==='compose' && S.c && location.hash===S.c.hash;
  if(!sameCompose && S.c){ S.c.abort?.abort(); S.c=null; }
  S.view=v; renderBoards();
  if(v.name==='feed'){ feedSig=null; renderFeed(); if(prev.name!=='feed'||prev.cat!==v.cat||prev.special!==v.special) scrollTo(0,0); }
  else if(v.name==='post'){ if(samePost){ S.d.sel=v.n; S.d.contentKey=null; renderPost(); } else { openPost(v); scrollTo(0,0); } }
  else if(v.name==='mod'){ S.modArm=null; renderMod(); scrollTo(0,0); }
  else if(!sameCompose){ openCompose(v); scrollTo(0,0); }
}
function renderBoards(){ const v=S.view, cur = v.name==='mod' ? 'mod' : v.special ? v.special : v.name==='feed' ? (v.cat||'all') : v.name==='post' ? S.posts.get(v.id)?.cat : null;
  $('#boards').innerHTML = [['all','전체'],['gems','보석함'],...CATS.map(([k,l])=>[k,l]),...(S.uid?[['saved','저장함']]:[]),...(S.isMod?[['mod','운영'+(reportGroups().size?` · 신고 ${reportGroups().size}`:'')]]:[])]
    .map(([k,l])=>`<a href="#${['all','gems','saved','mod'].includes(k)?k:'c-'+k}" aria-current="${cur===k}">${esc(l)}</a>`).join(''); }

/* ---------- feed ---------- */
let feedSig=null;
const hot = p => { const s=pS(p.id).score; return Math.sign(s)*Math.log10(Math.max(Math.abs(s),1)) + p.createdAt/1000/45000; };
const contro = p => { const s=pS(p.id), t=s.up+s.down; return t && Math.min(s.up,s.down) ? t*Math.min(s.up,s.down)/Math.max(s.up,s.down) : 0; };
const WIN = {day:864e5,week:6048e5,month:2592e6,all:Infinity};
function feedList(){ const v=S.view; let list=[...S.posts.values()];
  if(v.cat) list=list.filter(p=>p.cat===v.cat);
  if(v.special==='saved') list=list.filter(p=>S.saved[p.id]);
  if(v.special==='gems') list=list.filter(p=>isGem(pS(p.id)));
  if(S.tool) list=list.filter(p=>(p.tool||'').toLowerCase()===S.tool.toLowerCase());
  if(S.author) list=list.filter(p=>p.authorId===S.author);
  const q=S.q.trim().toLowerCase();
  if(q){ const tag=q.startsWith('#')?q.slice(1):null;
    list=list.filter(p=>tag?(p.tags||[]).includes(tag):[p.title,p.body,p.tool,(p.tags||[]).join(' '),p.url].join(' ').toLowerCase().includes(q)); }
  const sort = v.special==='gems' ? 'top' : S.prefs.sort;
  if(sort==='new') list.sort((a,b)=>b.createdAt-a.createdAt);
  else if(sort==='top'){ const w=v.special==='gems'?Infinity:WIN[S.prefs.win]; list=list.filter(p=>Date.now()-p.createdAt<=w).sort((a,b)=>pS(b.id).score-pS(a.id).score||b.createdAt-a.createdAt); }
  else if(sort==='contro') list=list.filter(p=>contro(p)>0).sort((a,b)=>contro(b)-contro(a));
  else if(sort==='pending') list=list.filter(p=>{ const s=pS(p.id); return s.up+s.down<5; }).sort((a,b)=>(pS(a.id).up+pS(a.id).down)-(pS(b.id).up+pS(b.id).down)||b.createdAt-a.createdAt);
  else list.sort((a,b)=>hot(b)-hot(a));
  if(!S.isMod) list=list.filter(p=>!hiddenP(p.id));
  if(!v.special && S.prefs.sort!=='pending'){ const pin=p=>!!S.cfg.pinned?.[p.id]; list=[...list.filter(pin),...list.filter(p=>!pin(p))]; }
  return list;
}
function ccount(pid){ let n=0; for(const c of S.comments.values()) if(c.postId===pid&&!c.deleted) n++; return n; }
function renderFeed(kind){
  // votes never reorder an open list (no jumping under the cursor); scores update in place
  if(kind==='votes' && $('#feedList')){ renderSideOnly(); return; }
  const v=S.view, list=feedList();

  if(t.dataset.sort){ S.prefs.sort=t.dataset.sort; savePrefs(); renderFeed(); return; }
  if(t.dataset.layout){ S.prefs.layout=t.dataset.layout; savePrefs(); renderFeed(); return; }
  if(t.dataset.clear){ if(t.dataset.clear==='q'){ S.q=''; $('#gq').value=''; } else S[t.dataset.clear]=null; renderFeed(); return; }
  e.preventDefault();

  else if(t.dataset.tag){ S.q='#'+t.dataset.tag; $('#gq').value=S.q; }

});

function lineDiff(a,b){
  const A=a.split('\n'),B=b.split('\n'); let s=0; while(s<A.length&&s<B.length&&A[s]===B[s]) s++;
  let e=0; while(e<A.length-s&&e<B.length-s&&A[A.length-1-e]===B[B.length-1-e]) e++;
  const a2=A.slice(s,A.length-e), b2=B.slice(s,B.length-e), N=a2.length, M=b2.length; if(N*M>6e6) return null;
  const dp=[]; for(let i=0;i<=N;i++) dp.push(new Uint32Array(M+1));
  for(let i=N-1;i>=0;i--) for(let j=M-1;j>=0;j--) dp[i][j]=a2[i]===b2[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; for(let k=0;k<s;k++) out.push([' ',A[k]]);
  let i=0,j=0; while(i<N&&j<M){ if(a2[i]===b2[j]){ out.push([' ',a2[i]]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) out.push(['-',a2[i++]]); else out.push(['+',b2[j++]]); }
  while(i<N) out.push(['-',a2[i++]]); while(j<M) out.push(['+',b2[j++]]); for(let k=A.length-e;k<A.length;k++) out.push([' ',A[k]]); return out; }
function diffHtml(a,b){ const d=lineDiff(a,b); if(!d) return '<div class="banner" style="margin:10px">너무 커서 변경점을 계산하지 않았어요.</div>';
  const add=d.filter(x=>x[0]==='+').length, del=d.filter(x=>x[0]==='-').length;
  const show=new Uint8Array(d.length); d.forEach((x,i)=>{ if(x[0]!==' ') for(let k=Math.max(0,i-3);k<=Math.min(d.length-1,i+3);k++) show[k]=1; });
  let h='',skip=0; d.forEach((x,i)=>{ if(!show[i]){ skip++; return; } if(skip){ h+=`<div class="gap">… ${skip}줄 동일 …</div>`; skip=0; } h+=`<div class="${x[0]==='+'?'a':x[0]==='-'?'d':''}">${x[0]} ${esc(x[1])}</div>`; });
  if(skip) h+=`<div class="gap">… ${skip}줄 동일 …</div>`;
  return `<div class="diff" style="margin-top:8px"><div class="gap"><span style="color:var(--ok)">+${add}</span> / <span style="color:var(--warn)">−${del}</span></div>${add+del?h:'<div class="gap">변경 없음</div>'}</div>`; }

async function modAction(act,t,uid2){ if(!S.isMod||!S.db) return;

  </form>
  <aside class="side"><section class="panel"><h2>좋은 글의 조건</h2><ul><li>어떤 도구로, 어떤 프롬프트로 만들었는지 적어요.</li><li>어디가 볼 만한지 한두 줄로 설명해요.</li><li>맞는 게시판과 형식을 골라요. 웹·게임은 실행물로 올리면 바로 돌려볼 수 있어요.</li></ul></section>
    ${S.sample?`<section class="panel"><h2>Claude 도우미</h2><p>내용을 보고 게시판, 제목, 태그를 추천해 줘요. 받은 추천은 바로 고칠 수 있어요.</p><button type="button" class="btn sm" id="aiGo">분류·제목 추천받기</button><p class="hint" id="aiStatus" style="margin:8px 0 0"></p></section>`:''}</aside></div>`;
  bindCompose(v,f);
}
function bindCompose(v,f){
  const kindSet=k=>{ S.c.kind=k; app.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===k));
    app.querySelectorAll('[data-for]').forEach(el=>el.hidden=!el.dataset.for.split(' ').includes(k));
    if(k==='html'||k==='code'){ $('[data-for="html code"]').hidden=false; }
    $('#pvWrap').hidden = k!=='html' || !$('#pv').firstChild;
    $('#codeLabel').textContent = k==='html'?'HTML 코드 (한 파일)':'코드';
    $('#fCode').placeholder = k==='html'?'<!doctype html> … AI가 만들어 준 HTML 파일 전체를 붙여 넣으세요':'코드를 붙여 넣으세요';
    $('#bodyLabel').textContent = k==='text'?'본문':'설명 (선택)'; };
  kindSet(f.kind);
  app.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ S.c.kindTouched=true; kindSet(b.dataset.kind); draft(); });
  $('#fCat').onchange=()=>{ S.lastCat=$('#fCat').value; if(!S.c.kindTouched) kindSet(CAT[$('#fCat').value].dk); draft(); };
  const code=$('#fCode'), sz=()=>{ const b=new Blob([code.value]).size; $('#codeSize').textContent=`${(b/1024).toFixed(1)} KB / 200 KB`; $('#codeSize').style.color=b>MAX_CODE?'var(--warn)':''; };
  const runPv=()=>{ if(!code.value.trim()) return; $('#pv').replaceChildren(sandboxFrame(code.value,'미리보기')); $('#pvWrap').hidden=false; };
  code.oninput=()=>{ sz(); draft(); }; sz();
  code.onkeydown=e=>{ if(e.key==='Tab'&&!e.shiftKey){ e.preventDefault(); code.setRangeText('  ',code.selectionStart,code.selectionEnd,'end'); } };
  $('#pvBtn').onclick=runPv;
  $('#fUrl').onchange=()=>{ const u=$('#fUrl').value.trim(); if(u&&!$('#fTitle').value) $('#fTitle').placeholder=domain(u)+'에서 찾은 …'; };
  const mdT=$('#mdToggle'), mdP=$('#mdPrev'); mdT.onclick=()=>{ mdP.hidden=!mdP.hidden; mdT.textContent=mdP.hidden?'미리보기':'미리보기 닫기'; mdP.innerHTML=md($('#fBody').value)||'<span class="muted">내용이 없어요</span>'; };
  $('#fBody').oninput=()=>{ if(!mdP.hidden) mdP.innerHTML=md($('#fBody').value); draft(); };
  ['fTitle','fTool','fTags','fPrompt','fUrl','fLang'].forEach(id=>$('#'+id).addEventListener('input',draft));
  const cd=$('#clearDraft'); if(cd) cd.onclick=()=>{ try{ localStorage.removeItem('slop-draft'); }catch{} S.c=null; openCompose(v); };
  // images
  const upl=$('#upl'), drop=$('#drop'), fi=$('#fFile');
  const drawUpl=()=>{ upl.innerHTML=S.c.assets.map((id,i)=>`<div><img src="/_blob/${esc(id)}" alt=""><button type="button" data-rm="${i}" aria-label="빼기">✕</button></div>`).join(''); upl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ S.c.assets.splice(+b.dataset.rm,1); drawUpl(); draft(); }); };
  const addFiles=async files=>{ if(!S.assets){ toast('이 화면에서는 이미지를 올릴 수 없어요'); return; }
    for(const file of [...files].filter(x=>/^image\/(png|jpeg|gif|webp)$/.test(x.type))){ if(S.c.assets.length>=8){ toast('이미지는 8장까지예요'); break; }
      drop.textContent='올리는 중…';
      try{ const r=await S.assets.upload(file); S.c.assets.push(r.id); drawUpl(); draft(); }
      catch(e){ toast(e?.code==='too_large'?'20MB보다 큰 이미지는 올릴 수 없어요':e?.code==='quota_or_state'?'저장 공간이 가득 찼어요':e?.code==='unsupported_type'?'PNG, JPG, GIF, WEBP만 올릴 수 있어요':'이미지를 올리지 못했어요'); } }
    drop.textContent='여기로 끌어 놓거나, 붙여 넣거나, 눌러서 고르세요 (최대 8장)'; };
  drop.onclick=()=>fi.click(); drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } };
  fi.onchange=()=>{ addFiles(fi.files); fi.value=''; };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
  $('#cmp').addEventListener('paste',e=>{ const fs=[...(e.clipboardData?.files||[])]; if(fs.length&&S.c.kind==='image'){ e.preventDefault(); addFiles(fs); } });
  drawUpl();
  if(S.sample) $('#aiGo').onclick=()=>suggest();
  $('#cmp').onsubmit=e=>{ e.preventDefault(); submit(v); };
}
function readForm(){ return { cat:$('#fCat').value, kind:S.c.kind, title:$('#fTitle').value.trim(), body:$('#fBody').value.trim(), url:$('#fUrl').value.trim(),
  code:$('#fCode').value, codeLang:$('#fLang').value.trim(), tool:$('#fTool').value.trim(), prompt:$('#fPrompt').value.trim(),
  tags:[...new Set($('#fTags').value.split(',').map(t=>t.trim().toLowerCase().replace(/^#/,'')).filter(Boolean))].slice(0,5), assetIds:[...S.c.assets] }; }
let draftT; function draft(){ if(S.c?.mode!=='new') return; clearTimeout(draftT); draftT=setTimeout(()=>{ try{ const f=readForm(); localStorage.setItem('slop-draft',JSON.stringify({...f,tags:f.tags.join(', ')})); }catch{} },500); }
async function suggest(){ const st=$('#aiStatus'), btn=$('#aiGo'); const f=readForm();
  if(!f.body&&!f.code&&!f.url&&!f.title&&!f.prompt){ st.textContent='먼저 내용을 조금 넣어 주세요.'; return; }
  btn.disabled=true; st.textContent='보는 중…';
  const prompt=`다음은 AI로 만든 결과물을 커뮤니티에 올리려는 글이야. 알맞은 분류를 JSON으로만 답해.
게시판 키 목록: ${CATS.map(c=>c[0]+'('+c[1]+')').join(', ')}
형식 키 목록: text, link, image, html, code
현재 제목: ${f.title||'(없음)'}
도구: ${f.tool||'(없음)'}
링크: ${f.url||'(없음)'}
본문: ${f.body.slice(0,2000)}
프롬프트: ${f.prompt.slice(0,1000)}
코드 앞부분: ${f.code.slice(0,1500)}
답 형식: {"cat":"게시판 키","kind":"형식 키","title":"40자 이내의 구체적인 한국어 제목","tags":["태그","최대5개"],"tool":"추정되는 도구 또는 빈 문자열"}`;
  try{ let r; try{ r=await S.sample.json(prompt,{modelTier:'quick'}); }catch(e){ if(e?.code) throw e; const t=await S.sample(prompt,{modelTier:'quick'}); r=JSON.parse(t.text.match(/\{[\s\S]*\}/)[0]); }
    if(r.cat&&CAT[r.cat]) $('#fCat').value=r.cat;
    if(r.kind&&KINDS[r.kind]&&!(r.kind==='image'&&!S.assets)) app.querySelector(`[data-kind="${r.kind}"]`)?.click();
    if(r.title&&!$('#fTitle').value.trim()) $('#fTitle').value=String(r.title).slice(0,120);
    if(Array.isArray(r.tags)&&!$('#fTags').value.trim()) $('#fTags').value=r.tags.slice(0,5).join(', ');
    if(r.tool&&!$('#fTool').value.trim()) $('#fTool').value=String(r.tool).slice(0,40);
    st.textContent='추천을 넣었어요. 이미 쓴 칸은 건드리지 않았어요.'; draft(); }
  catch(e){ st.textContent=e?.code==='not_granted'?'Claude 사용이 허용되지 않았어요.':e?.code==='rate_limited'?'요청이 많아요. 잠시 후 다시 시도해 주세요.':'추천을 받지 못했어요.'; }
  btn.disabled=false; }
async function submit(v){ const st=$('#subStatus'), btn=$('#submitBtn'), f=readForm();
  const err = !f.title ? '제목을 적어 주세요.' : f.kind==='link'&&!safeUrl(f.url) ? 'http:// 또는 https://로 시작하는 링크 주소를 넣어 주세요.'
    : f.kind==='image'&&!f.assetIds.length ? '이미지를 한 장 이상 올려 주세요.' : (f.kind==='html'||f.kind==='code')&&!f.code.trim() ? '코드를 넣어 주세요.'
    : new Blob([f.code]).size>MAX_CODE ? '코드가 200KB를 넘어요.' : f.kind==='text'&&!f.body ? '본문을 적어 주세요.' : '';
  if(err){ st.textContent=err; return; }
  const hasCode = f.kind==='html'||f.kind==='code';
  const snap={title:f.title,body:f.body,url:f.kind==='link'?f.url:'',assetIds:f.kind==='image'?f.assetIds:[],prompt:f.prompt,code:hasCode?f.code:'',authorId:S.uid};
  const meta={title:f.title,cat:f.cat,kind:f.kind,body:f.body,url:snap.url,assetIds:snap.assetIds,tool:f.tool,prompt:f.prompt,tags:f.tags,codeLang:f.kind==='code'?f.codeLang:'',codeHead:f.kind==='code'?f.code.split('\n').slice(0,8).join('\n').slice(0,600):''};
  btn.disabled=true; st.textContent='올리는 중…'; const now=Date.now();
  try{
    if(v.mode!=='edit'){ const id=newId();
      await S.db.doc(`posts/${id}/versions/v1`).set({...snap,n:1,note:v.mode==='remix'?`${S.c.src.title} v${S.c.ver.n} 리믹스`:'첫 버전',createdAt:now});
      await S.db.doc('posts/'+id).set({...meta,authorId:S.uid,createdAt:now,updatedAt:now,version:1,...(v.mode==='remix'?{remixOf:{id:S.c.src.id,n:S.c.ver.n,title:S.c.src.title}}:{})});
      if(v.mode==='new') try{ localStorage.removeItem('slop-draft'); }catch{}
      S.c=null; toast('올렸어요'); location.hash='p-'+id; return; }
    const ref=S.db.doc('posts/'+v.id);
    let l=await ref.acquire({holder:S.uid,ttlMs:10000}); if(!l.acquired){ await sleep(2500); l=await ref.acquire({holder:S.uid,ttlMs:10000}); }
    if(!l.acquired) throw {code:'busy'};
    const cur=(await ref.get()).data(); const n=(cur.version||1)+1;
    await ref.collection('versions').doc('v'+n).set({...snap,authorId:S.uid,n,note:$('#fNote').value.trim()||'수정',createdAt:now});
    await ref.update({...meta,version:n,updatedAt:now});
    for(const b of app.querySelectorAll('[data-addr]:checked')){ try{ await S.db.doc('comments/'+b.dataset.addr).update({resolved:n}); }catch{} }
    S.c=null; toast(`v${n}을 올렸어요`); location.hash='p-'+v.id;
  }catch(e){ btn.disabled=false; st.textContent = e?.code==='busy'?'다른 곳에서 동시에 저장 중이에요. 잠시 후 다시 눌러 주세요.':e?.code==='invalid_argument'?'이 공유 권한으로는 올릴 수 없어요.':e?.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'올리지 못했어요. 다시 시도해 주세요.'; }
}
boot();
</script>
